<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

        body {
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior-y: contain;
        }

        .pulse-subtle {
            animation: pulse-subtle 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.9; transform: scale(1.02); }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>

<span class="material-symbols-outlined text-primary text-[28px]" style="font-variation-settings: 'FILL' 1;">
                            security
                        </span>
</div>
</div>
</div>
</div>
<!-- Copy Content -->
<div class="text-center space-y-4 max-w-[320px] fade-in delay-200">
<h1 class="text-on-surface font-headline-lg-mobile text-headline-lg-mobile tracking-tight">
                Stay Protected

<p class="text-on-surface-variant font-body-md text-body-md leading-relaxed">
                AI Guardian Mode proactively monitors your safety during every journey.
            </p>
</div>
</main>
<!-- Bottom Controls -->
<footer class="px-margin-mobile pb-12 pt-6 fade-in delay-300">
<!-- Progress Dots -->

<div class="w-8 h-2 rounded-full bg-primary-container transition-all duration-300"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest transition-all duration-300"></div>

</div>
<!-- Primary Action -->
<div class="w-full max-w-sm mx-auto">
<button class="w-full h-14 bg-primary-container text-on-primary-container font-label-md text-label-md rounded-full shadow-[0px_8px_30px_rgba(245,119,153,0.15)] hover:scale-[1.02] active:scale-95 transition-all flex items-center justify-center gap-2">
                Next
                <span class="material-symbols-outlined text-[20px]">
                    arrow_forward
                </span>
</button>
</div>
</footer>
<!-- Interactive Layer: Discrete Micro-interactions -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const nextBtn = document.querySelector('button');
            
            // Subtle click effect
            nextBtn.addEventListener('mousedown', () => {
                nextBtn.style.transform = 'scale(0.95)';
            });
            
            nextBtn.addEventListener('mouseup', () => {
                nextBtn.style.transform = 'scale(1.02)';
            });

            // Intersection observer for entrance animations
            const observerOptions = {
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('opacity-100');
                        entry.target.classList.remove('opacity-0', 'translate-y-4');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.fade-in').forEach(el => {
                observer.observe(el);
            });
        });
    </script>
