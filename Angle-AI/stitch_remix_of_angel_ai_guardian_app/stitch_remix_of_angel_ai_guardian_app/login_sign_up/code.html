<body class="min-h-screen flex flex-col font-body-md overflow-x-hidden">
<!-- Top Navigation Anchor (Suppressing SideNav/BottomNav per transactional rule) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-center items-center h-20 px-margin-mobile">
<h1 class="text-primary font-headline-lg-mobile text-headline-lg-mobile tracking-tight">Angel AI</h1>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile pt-24 pb-12">
<!-- Welcome Section -->
<div class="w-full max-w-md text-center mb-10">
<h2 class="text-on-surface font-display-lg text-display-lg mb-2">Welcome back</h2>
<p class="text-on-surface-variant font-body-md text-body-md">Your guardian intelligence is waiting.</p>
</div>
<!-- Input Section -->
<div class="w-full max-w-md space-y-6">
<!-- Phone Number Input -->
<div class="space-y-2">
<label class="block text-on-surface-variant font-label-md text-label-md ml-1" for="phone">Phone Number</label>
<div class="relative">
<input class="w-full h-14 px-4 bg-secondary-container/20 border-none rounded-xl text-on-surface font-body-md placeholder:text-outline/50 transition-all focus:bg-white focus:ring-2 focus:ring-primary-container" id="phone" placeholder="+1 (555) 000-0000" type="tel"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-outline">
<span class="material-symbols-outlined" data-icon="phone_iphone">phone_iphone</span>
</div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full h-14 bg-primary-container text-on-primary font-label-md text-label-md rounded-full primary-shadow active:scale-[0.98] transition-transform duration-150">
                Continue
            </button>
<!-- Divider -->
<div class="relative flex items-center py-4">
<div class="flex-grow border-t border-outline-variant"></div>
<span class="flex-shrink mx-4 text-outline font-label-sm text-label-sm">or</span>
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Social Login -->
<button class="w-full h-14 bg-transparent border border-outline-variant text-on-surface font-label-md text-label-md rounded-full flex items-center justify-center gap-3 hover:bg-surface-container-low transition-colors active:scale-[0.98]">
<svg height="20" viewbox="0 0 24 24" width="20">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                Continue with Google
            </button>
</div>
<!-- Biometric Login -->
<div class="mt-xl flex flex-col items-center">
<button aria-label="Biometric Login" class="p-4 bg-surface-container rounded-full text-primary hover:bg-surface-container-high transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined !text-[40px]" data-icon="fingerprint">fingerprint</span>
</button>
<p class="mt-2 text-outline font-label-sm text-label-sm">Use FaceID or TouchID</p>
</div>

<!-- Footer Fine Print -->
<footer class="w-full px-margin-mobile pb-10 text-center">

            <a class="text-primary hover:underline" href="#">Terms of Service</a>

            <a class="text-primary hover:underline" href="#">Privacy Policy</a>.

<!-- Decorative Soft Elements (Background) -->
<div class="fixed top-[-10%] right-[-10%] w-[300px] h-[300px] bg-tertiary-fixed opacity-20 blur-[100px] rounded-full -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-5%] left-[-5%] w-[250px] h-[250px] bg-primary-fixed-dim opacity-30 blur-[80px] rounded-full -z-10 pointer-events-none"></div>
<script>
        // Micro-interaction: Focus effect for input container
        const phoneInput = document.getElementById('phone');
        const inputParent = phoneInput.parentElement;
        
        phoneInput.addEventListener('focus', () => {
            inputParent.classList.add('scale-[1.02]');
            inputParent.classList.add('duration-300');
        });
        
        phoneInput.addEventListener('blur', () => {
            inputParent.classList.remove('scale-[1.02]');
        });

        // Add ripple-like effect on buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                setTimeout(() => {
                    ripple.remove();
                }, 600);
            });
        });
    </script>
<style>
        /* Lightweight ripple style for micro-interactions */
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: ripple-animation 0.6s linear;
            width: 0;
            height: 0;
        }
        @keyframes ripple-animation {
            to {
                width: 400px;
                height: 400px;
                opacity: 0;
            }
        }
    </style>
