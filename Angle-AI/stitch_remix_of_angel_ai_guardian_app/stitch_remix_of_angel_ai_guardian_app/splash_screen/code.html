<!-- Navigation suppression check: This is a Splash Screen (Transactional/Onboarding), so TopAppBar and BottomNavBar from JSON are suppressed. -->
<script>
        // Simple Interaction: Click to proceed (Simulation for the prompt context)
        document.body.addEventListener('click', () => {
            console.log("Proceeding to next screen...");
            // In a real app, this would trigger a router push.
        });

        // Atmosphere Effect: Subtle cursor-following glow (Lightweight micro-interaction)
        document.addEventListener('mousemove', (e) => {
            const glow = document.createElement('div');
            glow.className = 'fixed pointer-events-none w-32 h-32 bg-primary-container/10 rounded-full blur-3xl transition-opacity duration-1000';
            glow.style.left = `${e.clientX - 64}px`;
            glow.style.top = `${e.clientY - 64}px`;
            document.body.appendChild(glow);
            setTimeout(() => glow.style.opacity = '0', 10);
            setTimeout(() => glow.remove(), 1000);
        });
    </script>
