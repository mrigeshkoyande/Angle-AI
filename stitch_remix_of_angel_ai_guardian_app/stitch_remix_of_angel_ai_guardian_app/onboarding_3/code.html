<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 20;
        }
        
        .onboarding-gradient {
            background: linear-gradient(180deg, #FFF7CD 0%, #FFF8F7 100%);
        }

        .pulse-soft {
            animation: pulse-soft 3s infinite ease-in-out;
        }

        @keyframes pulse-soft {
            0%, 100% { transform: scale(1); opacity: 0.1; }
            50% { transform: scale(1.1); opacity: 0.2; }
        }

        .float-animation {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
    </style>

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background min-h-screen flex flex-col items-center overflow-hidden font-body-md onboarding-gradient">
<!-- Top AppBar (Simplified for Onboarding - No Nav Shell) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16">
<div class="flex items-center gap-2">
<span class="text-title-lg font-title-lg font-bold text-primary">Angel AI</span>
</div>
<button class="text-label-md font-label-md text-on-surface-variant hover:opacity-80 transition-opacity">
            Help
        </button>
</header>
<main class="flex-1 w-full max-w-md flex flex-col justify-center items-center px-margin-mobile pt-16 pb-24 text-center">
<!-- Illustration Section -->
<div class="relative w-full aspect-square flex items-center justify-center mb-10">
<!-- Background Decorative Circles -->
<div class="absolute w-64 h-64 bg-primary-container rounded-full pulse-soft blur-3xl"></div>
<div class="absolute w-48 h-48 bg-tertiary-container rounded-full opacity-10 pulse-soft blur-2xl" style="animation-delay: 1.5s;"></div>
<!-- Main Lock Illustration -->
<div class="relative float-animation flex flex-col items-center">
<div class="w-48 h-48 bg-white rounded-[40px] shadow-[0px_8px_30px_rgba(245,119,153,0.15)] flex items-center justify-center relative z-10">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-[80px] text-primary" style="font-variation-settings: 'wght' 300, 'FILL' 1;">
                            lock
                        </span>
<!-- Subtle scan line detail -->
<div class="w-12 h-1 bg-primary/20 rounded-full mt-4 animate-pulse"></div>
</div>
<!-- Floating Data Bits -->
<div class="absolute -top-4 -right-4 w-12 h-12 bg-white rounded-2xl shadow-lg flex items-center justify-center animate-bounce" style="animation-duration: 3s;">
<span class="material-symbols-outlined text-secondary text-2xl">shield_person</span>
</div>
<div class="absolute -bottom-2 -left-6 w-14 h-14 bg-white rounded-2xl shadow-lg flex items-center justify-center animate-bounce" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-tertiary text-2xl">backup</span>
</div>
</div>
<!-- Floor Shadow -->
<div class="w-32 h-4 bg-on-surface/5 rounded-full blur-md mt-12"></div>
</div>
</div>
<!-- Text Content -->
<div class="space-y-4 mb-12">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-on-surface tracking-tight">
                Evidence That Stays Safe
            </h1>
<p class="text-body-md font-body-md text-on-surface-variant max-w-[280px] mx-auto leading-relaxed">
                The Smart Evidence Vault ensures your data is encrypted and backed up automatically.
            </p>
</div>
<!-- Progress Indicator -->
<div class="flex gap-2 mb-12">
<div class="h-2 w-2 rounded-full bg-outline-variant"></div>
<div class="h-2 w-2 rounded-full bg-outline-variant"></div>
<div class="h-2 w-8 rounded-full bg-primary-container"></div>
</div>
</main>
<!-- Bottom Actions Area -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile bg-gradient-to-t from-background to-transparent pb-10">
<div class="max-w-md mx-auto">
<button class="w-full h-14 bg-primary-container hover:bg-primary transition-all duration-300 rounded-full flex items-center justify-center gap-3 text-on-primary-container font-label-md text-label-md shadow-[0px_8px_30px_rgba(245,119,153,0.15)] active:scale-95" onclick="handleGetStarted()">
                Get Started
                <span class="material-symbols-outlined text-xl">arrow_forward</span>
</button>
<p class="mt-6 text-center text-label-sm font-label-sm text-outline">
                Part 3 of 3 • Secure Onboarding
            </p>
</div>
</footer>
<script>
        function handleGetStarted() {
            const btn = event.currentTarget;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span>';
            
            // Artificial delay to simulate transition/setup
            setTimeout(() => {
                // In a real app, this would route to the Home/Dashboard
                document.body.style.opacity = '0';
                document.body.style.transition = 'opacity 0.5s ease-out';
                setTimeout(() => {
                    alert('Onboarding Complete. Welcome to Angel AI.');
                    window.location.reload();
                }, 500);
            }, 800);
        }

        // Add a parallax effect to background elements based on device tilt or mouse
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            
            const decorativeElements = document.querySelectorAll('.pulse-soft');
            decorativeElements.forEach(el => {
                el.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });
    </script>
